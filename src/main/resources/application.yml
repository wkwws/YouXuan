#数据库连接配置
spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://localhost:3306/secondhand_market
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      password: 123456
  rabbitmq:
    host: localhost # 你的虚拟机IP
    port: 5672 # 端口
    virtual-host: /hmall # 虚拟主机
    username: hmall2 # 用户名
    password: 123321 # 密码
    template:
      retry:
        enabled: true
        initial-interval: 1000ms  #初始间隔时间
        multiplier: 1  #每次重链接时间递乘数
        max-attempts: 3  #最大重连次数
    publisher-returns: false
    publisher-confirm-type: none

server:
  port: 8081

secondhand:
  jwt:
    secret-key: wangkaiweiwangkaiweiwangkaiweiwangkaiwei
    ttl-mills: 17000000
    user-token-name: Authorization

  alioss:
    endpoint: ${dev.alioss.endpoint}
    access-key-id: ${dev.alioss.access-key-id}
    access-key-secret: ${dev.alioss.access-key-secret}
    bucket-name: ${dev.alioss.bucket-name}




